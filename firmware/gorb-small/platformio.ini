; G.O.R.B Small firmware for ESP32 + LoRa boards.
; Build and flash:  pio run -e heltec_v3 -t upload
; Pick the env that matches your board.

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@7.1.2
board_build.filesystem = littlefs

; Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
[env:heltec_v3]
board = heltec_wifi_lora_32_V3
build_flags =
  -DGORB_SX1262
  -DLORA_NSS=8 -DLORA_DIO1=14 -DLORA_RST=12 -DLORA_BUSY=13
  -DLORA_SCK=9 -DLORA_MISO=11 -DLORA_MOSI=10
  -DLORA_TCXO=1.8 -DLED_PIN=35

; LilyGo TTGO LoRa32 T3 v1.6.1 (ESP32 + SX1276)
[env:lilygo_t3]
board = ttgo-lora32-v21
build_flags =
  -DGORB_SX1276
  -DLORA_NSS=18 -DLORA_DIO0=26 -DLORA_RST=23 -DLORA_DIO1=33
  -DLORA_SCK=5 -DLORA_MISO=19 -DLORA_MOSI=27 -DLED_PIN=25

; LilyGo T-Beam v1.x with SX1276 (ESP32 + SX1276)
[env:tbeam]
board = ttgo-t-beam
build_flags =
  -DGORB_SX1276
  -DLORA_NSS=18 -DLORA_DIO0=26 -DLORA_RST=23 -DLORA_DIO1=33
  -DLORA_SCK=5 -DLORA_MISO=19 -DLORA_MOSI=27

; Any ESP32 dev board wired to an RFM95W / SX1276 module (see README for wiring)
[env:esp32_rfm95]
board = esp32dev
build_flags =
  -DGORB_SX1276
  -DLORA_NSS=5 -DLORA_DIO0=2 -DLORA_RST=14 -DLORA_DIO1=4
  -DLORA_SCK=18 -DLORA_MISO=19 -DLORA_MOSI=23 -DLED_PIN=2

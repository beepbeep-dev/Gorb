<!doctype html>
<html><head><meta charset="utf-8"><title>Gorb Pixels and Gorb Motion</title>
<style>
body { font-family: Georgia, serif; max-width: 680px; margin: 32px auto; padding: 0 16px; color: #1d2b25; }
h1 { color: #0b7a4b; }
figure { margin: 24px 0; }
figure img { width: 100%; height: auto; border-radius: 8px; display: block; }
figcaption { color: #556; font-size: 14px; margin-top: 6px; }
</style></head>
<body>
<h1>Pictures over the radio</h1>
<p>This picture started as a 334 KB photo. The host squeezed it to about 6 KB before
sending it, and your browser showed a tiny blurry preview first while the rest arrived.</p>
<figure>
  <img src="media/tower.jpg" alt="A radio tower at dusk" width="640" height="427">
  <figcaption>Gorb Pixels: 334 KB photo &rarr; ~6 KB over the air</figcaption>
</figure>
<p>Videos work too. A normal video tag becomes a short, silent, looping clip:</p>
<figure>
  <video src="media/waves.mp4" width="640" height="427" controls></video>
  <figcaption>Gorb Motion: 39 KB video &rarr; ~12 KB clip</figcaption>
</figure>
<p><a href="index.html">Back home</a></p>
</body></html>

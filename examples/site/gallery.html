<!doctype html>
<html><head><meta charset="utf-8"><title>Gorb Pixels 2 and Gorb Motion 2</title>
<style>
body { font-family: Georgia, serif; max-width: 680px; margin: 32px auto; padding: 0 16px; color: #1d2b25; }
h1 { color: #0b7a4b; }
figure { margin: 24px 0; }
figure img, figure video { width: 100%; height: auto; border-radius: 8px; display: block; background: #eee; }
figcaption { color: #556; font-size: 14px; margin-top: 6px; }
</style></head>
<body>
<h1>Pictures and video over the radio</h1>
<p>This picture started as a 334 KB photo. It reaches you in three layers: a blurry
150-byte preview straight away, a 6 KB picture a few seconds later, then a sharp
24 KB HD picture.</p>
<figure>
  <img src="media/tower.jpg" alt="A radio tower at dusk" width="640" height="427">
  <figcaption>Gorb Pixels 2: preview → standard (6 KB) → HD (24 KB)</figcaption>
</figure>
<p>Videos are real video with sound, squeezed to about 40 KB:</p>
<figure>
  <video src="media/waves.mp4" width="640" height="426" controls></video>
  <figcaption>Gorb Motion 2: AV1 video + Opus sound (H.264 for browsers without AV1)</figcaption>
</figure>
<p><a href="index.html">Back home</a></p>
</body></html>

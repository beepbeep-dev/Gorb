<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-label="G.O.R.B - In GORB we speak, in GORB we use">
  <title>G.O.R.B - Global Open Radio Browser</title>
  <rect width="520" height="250" rx="28" fill="#0f1714"/>
  <!-- faint radio waves spreading from the O -->
  <g fill="none" stroke="#4ff0a0" stroke-linecap="round" stroke-width="5">
    <path d="M159 5 A100 100 0 0 0 159 159" opacity=".14"/><path d="M287 5 A100 100 0 0 1 287 159" opacity=".14"/>
    <path d="M142 -15 A126 126 0 0 0 142 179" opacity=".08"/><path d="M304 -15 A126 126 0 0 1 304 179" opacity=".08"/>
  </g>
  <g transform="translate(73 32)" fill="none" stroke="#4ff0a0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- G -->
    <path d="M61 23 A36 36 0 1 0 72 50 H46"/>
    <!-- O: a broadcasting antenna -->
    <circle cx="150" cy="50" r="36"/>
    <circle cx="150" cy="50" r="17" stroke-width="6"/>
    <circle cx="150" cy="50" r="6.5" fill="#4ff0a0" stroke="none"/>
    <!-- R -->
    <path d="M228 92 V8 H256 A21 21 0 0 1 256 50 H228 M252 50 L280 92"/>
    <!-- B -->
    <path d="M322 92 V8 H348 A20 20 0 0 1 348 48 H322 M348 48 H352 A22 22 0 0 1 352 92 H322"/>
    <!-- the dots in G.O.R.B -->
    <g fill="#4ff0a0" stroke="none"><circle cx="93" cy="86" r="7"/><circle cx="207" cy="86" r="7"/><circle cx="301" cy="86" r="7"/></g>
  </g>
  <text x="260" y="178" text-anchor="middle" fill="#7fa596" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="15" letter-spacing="5" font-weight="600">GLOBAL OPEN RADIO BROWSER</text>
  <text x="260" y="218" text-anchor="middle" fill="#d8f5e6" font-family="Georgia, 'DejaVu Serif', serif"
        font-size="21" font-style="italic">“In GORB we speak, in GORB we use.”</text>
</svg>
